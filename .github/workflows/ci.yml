name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structure
        run: bash scripts/check-structure.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e "./core[dev]"
          pip install -e "./services/inference-api[dev]"
      - name: Ruff
        run: ruff check core/aarogya_core services/inference-api/app
      - name: Black
        run: black --check core/aarogya_core services/inference-api/app
      - name: isort
        run: isort --check-only core/aarogya_core services/inference-api/app
      - name: mypy
        run: mypy core/aarogya_core services/inference-api/app
      - name: pytest
        working-directory: services/inference-api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm --filter @aarogya/web lint
      - run: pnpm --filter @aarogya/web build
