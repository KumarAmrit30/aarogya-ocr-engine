[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aarogya-benchmarks"
version = "0.1.0"
description = "Comparative benchmarking keyed by pipeline × dataset version"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aarogya-core",
  "aarogya-evaluation",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["aarogya_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["aarogya_core", "aarogya_evaluation", "aarogya_benchmarks", "app"]

[tool.ruff.lint.isort]
known-first-party = ["aarogya_core", "aarogya_evaluation", "aarogya_benchmarks", "app"]
