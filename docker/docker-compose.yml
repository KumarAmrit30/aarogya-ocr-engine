# Development stack only — not for production.
services:
  inference-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env.example
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
      AAROGYA_REPO_ROOT: /workspace
    volumes:
      - ../core:/app/core
      - ../services/inference-api:/app/services/inference-api
      - ../datasets:/workspace/datasets
      - ../registry:/workspace/registry
      - ../configs:/workspace/configs
    working_dir: /app/services/inference-api

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ../apps/web:/app/apps/web
      - ../shared:/app/shared
    depends_on:
      - inference-api

  # Future GPU worker — not started by default.
  # Usage: docker compose -f docker/docker-compose.yml --profile gpu up
  gpu-worker:
    profiles: ["gpu"]
    image: python:3.12-slim
    command: >
      bash -c "echo 'gpu-worker placeholder — wire torch/paddle worker later' && sleep infinity"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
